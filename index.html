<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Flex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1 class="logo">LOGO</h1>
            <nav>
                <a href="#link1">Link 1</a>
                <a href="#link2">Link 2</a>
                <a href="#link3">Link 3</a>
                <a href="#link4">Link 4</a>
            </nav>
            <button class="btn btn-top">Botão</button>
        </div>    
    </header>
    <main class="main-container">
        <section class="title-container" id="link1">
            <div class="title-items">
                <h2>TITULO PRINCIPAL</h2>
                <p>Subtitulo ou Linha 1</p>
                <p>Linha 2</p>
                <button class="btn">Botão CTA</button>
            </div>
            <img src="" alt="Imagem" class="img">
        </section>
        <section class="mainsec-container" id="link2">
            <div class="mainsec-items">
                <p>SECTION PRINCIPAL (3 Cards)</p>
                <div class="mainsec-cards">
                    <div class="card">
                        <img src="" alt="Imagem" class="img img-card">
                        <h4>TITULO CARD</h4>
                    </div>
                    <div class="card">
                        <img src="" alt="Imagem" class="img img-card">
                        <h4>TITULO CARD</h4>
                    </div>
                    <div class="card">
                        <img src="" alt="Imagem" class="img img-card">
                        <h4>TITULO CARD</h4>
                    </div>
                </div>
            </div>
            <aside class="card sidebar-card">
            </aside>
        </section>
    </main>
</body>
</html>
